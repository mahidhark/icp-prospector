# The first ICP this tool was built for. Copy this file to define another.
#
# `npm run icp -- --check icps/<file>.yaml` validates it without spending anything.

name: meta-tech-providers-india

description: >
  Meta Tech Providers and WhatsApp Business Solution Providers (BSPs) in India
  that give SMBs access to the WhatsApp Cloud API through their own CRM:
  contacts, template management, campaigns, shared inbox and chatbots.

geography: [India]

# Who we want to talk to at a prospect company. Used by contact enrichment (later sessions).
buyerTitles:
  - Founder
  - CEO
  - CTO
  - Chief Product Officer
  - Head of Product
  - Head of Partnerships

# Topics tagged in each contact's recent LinkedIn posts (npm run contacts).
personSignals:
  - { id: ai-agents, description: "talks about AI agents, LLMs or agentic tools" }
  - { id: automation, description: "workflows, no-code tools (n8n, Make, Zapier) or integrations" }
  - { id: whatsapp, description: "WhatsApp, Meta or business messaging" }
  - { id: growth-hiring, description: "fundraising, growth, hiring or launches" }
  - { id: churn-retention, description: "customer churn, retention or engagement" }

# How qualified companies are grouped. `weight` is added to the prospect score,
# so it encodes which segment to call first.
segments:
  - id: smb-crm
    description: Self-serve WhatsApp CRM / marketing dashboard sold to many small businesses (campaigns, inbox, templates)
    weight: 15
  - id: d2c-commerce
    description: WhatsApp commerce for D2C and e-commerce brands (cart recovery, Shopify flows, order updates)
    weight: 10
  - id: conversational-ai
    description: Chatbot or AI agent platform whose main channel includes WhatsApp
    weight: 5
  - id: enterprise-cpaas
    description: Messaging API / CPaaS provider selling WhatsApp at volume to large enterprises
    weight: 0

# How much of what pip0 sells a prospect already has. Judged per company from
# Google snippets (npm run capabilities) as the highest level a snippet shows,
# with a verbatim quote. Nearly every provider CLAIMS AI (71 of 92 on
# 2026-09-23), so the claim is neutral; only real depth moves a company down.
capabilities:
  - id: ai-depth
    description: How far the company's own product goes in AI agents and cross-app automation
    queries:
      - '"{name}" AI agent WhatsApp'
      - '"{name}" workflow builder OR flow builder OR automation builder'
    levels:
      - { id: none, description: "snippets describe what it sells (messaging, API, CRM, campaigns) with no AI or automation features", weight: 5 }
      - { id: ai-claim, description: "AI only in marketing language: taglines like AI-first, AI-powered, smart, with no named AI product or feature", weight: 5 }
      - { id: chatbot, description: "a chatbot or bot builder: rule-based flows, FAQ bots, keyword replies, or a basic GPT chatbot answering from FAQs", weight: 0 }
      - { id: agent-product, description: "a named AI agent product or feature customers deploy (AI sales/support/voice agents that act, not just answer)", weight: -15 }
      - { id: agent-plus-workflows, description: "an AI agent product AND its own workflow engine that connects to many external apps or systems", weight: -35 }
    unknownWeight: -10

# Checked per qualified company by `npm run signals`: is it listed here?
# A company with its own Zapier/Make app has already invested in no-code.
signalChecks:
  - { signal: zapier-app, site: zapier.com/apps }
  - { signal: make-app, site: make.com/en/integrations }
  - { signal: n8n-node, site: n8n.io/integrations }

# What we believe, stated so the evidence can contradict it. The themes report
# says, per hypothesis, whether the collected posts support or undercut it.
hypotheses:
  - id: nocode-bypass
    statement: >
      SMBs and freelance builders connect n8n, Make or Zapier directly to the
      WhatsApp Cloud API, bypassing Tech Provider CRMs.
  - id: agentic-bypass
    statement: >
      AI agents and MCP servers (including Meta's own agentic tooling) let
      businesses reach WhatsApp Business without a Tech Provider's product.
  - id: bsp-cost-pain
    statement: >
      SMBs see Tech Provider / BSP markups and per-message fees as poor value
      and look for cheaper or direct routes.
  - id: automation-gap
    statement: >
      SMBs on Tech Provider CRMs want automations and integrations with their
      other tools that the CRM does not offer.

sources:
  reddit:
    # One actor run per community, plus one site-wide run, posts only. Each costs a
    # $0.02 start fee plus $0.004 per stored item, so maxItemsPerRun is the
    # cost dial: 8 runs x 60 items is about $2.08.
    communities:
      - WhatsappBusinessAPI
      - whatsapp
      - n8n
      - automation
      - SaaS
      - IndianStartups
      - smallbusinessindia
    siteWide: true
    searches:
      - WhatsApp Cloud API
      - WhatsApp Business API
      - WhatsApp BSP
      - WhatsApp tech provider
    time: year
    maxItemsPerRun: 60

  google:
    countryCode: in
    queries:
      # Marketplace listings. These mostly surface global tools, not the ICP's
      # own apps; `npm run signals` checks each qualified company directly.
      - { query: "site:zapier.com/apps whatsapp", signal: zapier-app, pages: 3 }
      - { query: "site:make.com/en/integrations whatsapp", signal: make-app, pages: 3 }
      - { query: "site:n8n.io/integrations whatsapp", signal: n8n-node, pages: 2 }
      # Market searches: snippets only.
      - { query: "WhatsApp Business API provider India", pages: 3 }
      - { query: "WhatsApp Business API CRM for small business India", pages: 2 }
      - { query: "Meta tech provider WhatsApp platform India", pages: 2 }
      - { query: "WhatsApp marketing platform India SMB", pages: 2 }
      - { query: "WhatsApp chatbot platform India", pages: 2 }
      - { query: "WhatsApp commerce platform D2C brands India", pages: 2 }
      # Listicles and alternatives pages: one page each, with page text,
      # because the names are in the article, not the snippet.
      - { query: "best WhatsApp Business API providers India", fetchContent: true }
      - { query: "Interakt alternatives", fetchContent: true }
      - { query: "AiSensy alternatives", fetchContent: true }
      - { query: "Wati alternatives India", fetchContent: true }
      - { query: "WhatsApp BSP list India", fetchContent: true }
